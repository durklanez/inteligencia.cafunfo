<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ELI AI</title>


<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}


/* =====================================================
   CHAT
===================================================== */

.chat{
    height:45vh;

    background:#0a3d0a;

    display:flex;
    flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    padding:10px;

    background:#062806;

    color:#0f0;

    font-weight:bold;

    display:flex;

    justify-content:space-between;

    align-items:center;

    border-bottom:1px solid #0f0;
}


.header-left{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;
}


.project-name{

    color:#fff;

    font-size:13px;

    font-weight:normal;

    max-width:180px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


.header-buttons{

    display:flex;

    gap:5px;
}


.header button{

    border:none;

    border-radius:6px;

    padding:7px 10px;

    cursor:pointer;

    font-weight:bold;
}


.project-btn{

    background:#111;

    color:#0f0;

    border:1px solid #0f0 !important;
}


.btn2{

    background:#fa0 !important;

    color:#000;
}


/* =====================================================
   MENSAGENS
===================================================== */

.msgs{

    flex:1;

    overflow-y:auto;

    padding:10px;
}


.msg{

    padding:10px;

    border-radius:8px;

    margin:5px 0;

    max-width:85%;

    white-space:pre-wrap;

    word-wrap:break-word;

    overflow-wrap:anywhere;
}


.user{

    background:#1a1a1a;

    color:#0f0;

    margin-left:auto;
}


.eli{

    background:#0f5f0f;

    color:#fff;
}


/* =====================================================
   INPUT
===================================================== */

.input{

    display:flex;

    padding:10px;

    background:#062806;

    gap:5px;

    border-top:2px solid #0f0;
}


.input input{

    flex:1;

    min-width:0;

    padding:12px;

    background:#111;

    border:1px solid #0f0;

    color:#fff;

    border-radius:8px;

    outline:none;
}


.input input:focus{

    box-shadow:
        0 0 0 2px rgba(0,255,0,.12);
}


.input button{

    padding:12px;

    background:#0f0;

    color:#000;

    border:none;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;
}


/* =====================================================
   EDITOR
===================================================== */

.editor{

    height:27.5vh;

    background:#0a0f2e;

    border-top:2px solid #60a5fa;
}


.tabs{

    background:#062806;

    padding:5px;

    display:flex;

    gap:5px;

    border-bottom:1px solid #0f0;

    overflow-x:auto;

    min-height:35px;
}


.tab{

    padding:6px 12px;

    background:#111;

    border:1px solid #0f0;

    border-radius:5px;

    cursor:pointer;

    color:#0f0;

    font-size:12px;

    white-space:nowrap;
}


.tab.active{

    background:#0f0;

    color:#000;

    font-weight:bold;
}


.editor textarea{

    width:100%;

    height:calc(100% - 45px);

    background:#0a0f2e;

    color:#93c5fd;

    border:none;

    padding:10px;

    resize:none;

    outline:none;

    font-size:13px;

    font-family:Consolas,monospace;

    line-height:1.45;
}


/* =====================================================
   CONSOLE
===================================================== */

.console{

    height:20vh;

    background:#3d3d00;
}


.chead{

    padding:8px;

    background:#2e2e00;

    color:yellow;

    display:flex;

    justify-content:space-between;

    align-items:center;
}


.chead button{

    cursor:pointer;
}


.cbody{

    padding:10px;

    color:#ff9;

    font-size:12px;

    height:calc(100% - 40px);

    overflow-y:auto;
}


/* =====================================================
   MENU
===================================================== */

#menuBox{

    display:none;

    position:fixed;

    bottom:70px;

    left:10px;

    background:#111;

    border:2px solid #0f0;

    padding:10px;

    border-radius:10px;

    width:240px;

    max-width:calc(100vw - 20px);

    z-index:999;
}


#menuBox div{

    padding:9px;

    cursor:pointer;

    border-radius:5px;

    border-bottom:1px solid #222;
}


#menuBox div:hover{

    background:#0f0;

    color:#000;
}


#menuBox .lang{

    color:#60a5fa;
}


/* =====================================================
   AVISO
===================================================== */

.aviso{

    color:#fa0;

    font-weight:bold;

    margin-top:8px;

    font-size:13px;
}


/* =====================================================
   CAIXA DE CÓDIGO
===================================================== */

.codebox{

    margin-top:8px;

    background:#050505;

    border:1px solid #333;

    border-radius:6px;

    padding:8px;

    overflow:auto;

    max-height:180px;
}


.codebox pre{

    margin:0;

    color:#93c5fd;

    font-size:12px;

    white-space:pre-wrap;

    word-break:break-word;
}


/* =====================================================
   BOTÃO ENVIAR PARA EDITOR
===================================================== */

.editor-send{

    margin-top:10px;

    padding:11px 16px;

    background:#60a5fa;

    color:#000;

    border:none;

    border-radius:8px;

    font-weight:bold;

    font-size:13px;

    cursor:pointer;

    box-shadow:
        0 2px 8px rgba(0,0,0,.3);

    transition:
        transform .15s,
        background .15s;
}


.editor-send:hover{

    background:#93c5fd;

    transform:translateY(-1px);
}


.editor-send:active{

    transform:scale(.97);
}


/* =====================================================
   LINK DO SITE
===================================================== */

.site-link{

    display:inline-block;

    margin-top:8px;

    padding:9px 14px;

    background:#0f0;

    color:#000;

    border-radius:7px;

    font-weight:bold;

    text-decoration:none;

    cursor:pointer;
}


.site-link:hover{

    background:#7cff7c;
}


/* =====================================================
   STATUS
===================================================== */

.save-status{

    position:fixed;

    right:10px;

    bottom:10px;

    background:#111;

    border:1px solid #333;

    color:#777;

    padding:5px 8px;

    border-radius:6px;

    font-size:10px;

    z-index:1000;

    opacity:.85;
}


.save-status.saved{

    color:#0f0;
}


/* =====================================================
   BOTÃO DESABILITADO
===================================================== */

button:disabled{

    opacity:.6;

    cursor:not-allowed;
}

</style>

</head>


<body>


<!-- =====================================================
     CHAT
===================================================== -->

<div class="chat">


    <div class="header">


        <div class="header-left">

            <span>
                ELI AI
            </span>


            <span
                id="projectName"
                class="project-name"
            >
                • Projeto
            </span>

        </div>


        <div class="header-buttons">


            <button
                class="project-btn"
                onclick="voltarProjetos()"
                title="Meus Projetos"
            >
                📁
            </button>


            <button
                class="btn2"
                onclick="toggleMenu()"
            >
                ⋮
            </button>

        </div>

    </div>



    <div
        class="msgs"
        id="msgs"
    ></div>



    <div class="input">


        <input
            id="perg"
            placeholder="Digite..."
            autocomplete="off"
            onkeypress="
                if(event.key==='Enter'){
                    enviar()
                }
            "
        >


        <button
            class="btn2"
            onclick="enviarFoto()"
        >
            📷
        </button>


        <button
            onclick="enviar()"
        >
            Enviar
        </button>

    </div>

</div>



<!-- =====================================================
     EDITOR
===================================================== -->

<div
    class="editor"
    id="editorBox"
>


    <div
        class="tabs"
        id="tabs"
    ></div>


    <textarea
        id="editor"
        spellcheck="false"
        oninput="salvarCodigoAutomatico()"
    >Adiciona uma linguagem no menu ⋮</textarea>

</div>



<!-- =====================================================
     CONSOLE
===================================================== -->

<div class="console">


    <div class="chead">


        <span>
            CONSOLE
        </span>


        <div>


            <button
                class="btn2"
                onclick="enviarErro()"
            >
                🐛
            </button>


            <button
                onclick="run()"
            >
                RUN
            </button>

        </div>

    </div>


    <div
        class="cbody"
        id="log"
    >

        &gt; Conectado...<br>
        &gt; Aguardando...

    </div>

</div>



<!-- =====================================================
     MENU
===================================================== -->

<div id="menuBox">


    <div
        onclick="addLang('html')"
        class="lang"
    >
        🌐 Adicionar HTML
    </div>


    <div
        onclick="addLang('css')"
        class="lang"
    >
        🎨 Adicionar CSS
    </div>


    <div
        onclick="addLang('js')"
        class="lang"
    >
        📜 Adicionar JS
    </div>


    <div
        onclick="addLang('py')"
        class="lang"
    >
        🐍 Adicionar Python
    </div>


    <hr>


    <div
        onclick="mostrarInfoProjeto()"
    >
        📁 Projeto atual
    </div>


    <div
        onclick="voltarProjetos()"
    >
        ↩️ Meus Projetos
    </div>


    <hr>


    <div
        onclick="limparConversa()"
    >
        🧹 Limpar conversa
    </div>


    <div
        onclick="limpar()"
    >
        🧹 Limpar Console
    </div>

</div>



<!-- =====================================================
     STATUS
===================================================== -->

<div
    id="saveStatus"
    class="save-status"
>
    💾 Salvo
</div>



<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let arquivos = {};

let abaAtual = null;

let ultimoCod = "";

let ultimoTipo = "js";

let historico = [];

let enviando = false;

let projetoAtual = null;

let salvarTimer = null;


/*
 * Guarda cada código gerado pela ELI
 * com seu próprio ID.
 */

let codigosGerados = {};


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.onload = function(){

    iniciarProjeto();

};


/* =====================================================
   INICIAR PROJETO
===================================================== */

function iniciarProjeto(){

    const projetoSalvo =
        localStorage.getItem(
            "projetoAtual"
        );


    if(!projetoSalvo){

        alert(
            "Nenhum projeto foi selecionado."
        );


        window.location.href =
            "/";


        return;

    }


    try{

        projetoAtual =
            JSON.parse(
                projetoSalvo
            );

    }catch(e){

        localStorage.removeItem(
            "projetoAtual"
        );


        window.location.href =
            "/";


        return;

    }


    if(
        !projetoAtual ||
        !projetoAtual.id
    ){

        alert(
            "Projeto inválido."
        );


        window.location.href =
            "/";


        return;

    }


    document
        .getElementById(
            "projectName"
        )
        .innerText =
        "• " +
        (
            projetoAtual.nome ||
            "Projeto"
        );


    carregarDadosProjeto();

}


/* =====================================================
   CHAVE DO PROJETO
===================================================== */

function chaveProjeto(){

    if(
        !projetoAtual ||
        !projetoAtual.id
    ){

        return null;

    }


    return (
        "eli_projeto_" +
        projetoAtual.id
    );

}


/* =====================================================
   CARREGAR PROJETO
===================================================== */

function carregarDadosProjeto(){

    const chave =
        chaveProjeto();


    if(!chave){

        return;

    }


    const dadosSalvos =
        localStorage.getItem(
            chave
        );


    /*
     * PROJETO NOVO
     */

    if(!dadosSalvos){

        arquivos = {};

        abaAtual = null;

        ultimoCod = "";

        ultimoTipo = "js";

        historico = [];

        criarMensagemInicial();

        atualizarStatus(
            "💾 Novo projeto"
        );

        return;

    }


    try{

        const dados =
            JSON.parse(
                dadosSalvos
            );


        arquivos =
            dados.arquivos || {};


        historico =
            dados.historico || [];


        abaAtual =
            dados.abaAtual || null;


        ultimoCod =
            dados.ultimoCod || "";


        ultimoTipo =
            dados.ultimoTipo || "js";


        reconstruirAbas();


        restaurarHistorico();


        if(
            abaAtual &&
            arquivos[
                abaAtual
            ] !== undefined
        ){

            abrirAba(
                abaAtual
            );

        }else{

            document
                .getElementById(
                    "editor"
                )
                .value =
                "Adiciona uma linguagem no menu ⋮";

        }


        atualizarStatus(
            "💾 Projeto carregado"
        );


    }catch(e){

        console.error(
            "Erro ao carregar projeto:",
            e
        );


        arquivos = {};

        historico = [];

        abaAtual = null;

        criarMensagemInicial();

    }

}


/* =====================================================
   MENSAGEM INICIAL
===================================================== */

function criarMensagemInicial(){

    const msgs =
        document.getElementById(
            "msgs"
        );


    msgs.innerHTML = "";


    addMsg(
        "Fala wy! Sou a Eli. Me pede código 🚀",
        "eli",
        false
    );

}


/* =====================================================
   RECONSTRUIR ABAS
===================================================== */

function reconstruirAbas(){

    const tabs =
        document.getElementById(
            "tabs"
        );


    tabs.innerHTML = "";


    Object.keys(
        arquivos
    ).forEach(
        function(lang){

            criarAba(
                lang
            );

        }
    );

}


/* =====================================================
   SALVAR PROJETO
===================================================== */

function salvarProjeto(){

    const chave =
        chaveProjeto();


    if(!chave){

        return;

    }


    salvarCodigo();


    const dados = {

        projeto:
            projetoAtual,

        arquivos:
            arquivos,

        historico:
            historico,

        abaAtual:
            abaAtual,

        ultimoCod:
            ultimoCod,

        ultimoTipo:
            ultimoTipo,

        atualizadoEm:
            new Date().toISOString()

    };


    try{

        localStorage.setItem(
            chave,
            JSON.stringify(
                dados
            )
        );


        atualizarStatus(
            "💾 Salvo"
        );


    }catch(e){

        console.error(
            "Erro ao salvar projeto:",
            e
        );


        atualizarStatus(
            "⚠️ Erro ao salvar"
        );

    }

}


/* =====================================================
   SALVAMENTO AUTOMÁTICO
===================================================== */

function salvarAutomaticamente(){

    clearTimeout(
        salvarTimer
    );


    salvarTimer =
        setTimeout(
            function(){

                salvarProjeto();

            },
            300
        );

}


/* =====================================================
   STATUS
===================================================== */

function atualizarStatus(texto){

    const status =
        document.getElementById(
            "saveStatus"
        );


    if(!status){

        return;

    }


    status.innerText =
        texto;


    status.classList.add(
        "saved"
    );

}


/* =====================================================
   SALVAR CÓDIGO
===================================================== */

function salvarCodigo(){

    if(
        abaAtual &&
        document.getElementById(
            "editor"
        )
    ){

        arquivos[
            abaAtual
        ] =
            document.getElementById(
                "editor"
            ).value;

    }

}


/* =====================================================
   SALVAR ENQUANTO DIGITA
===================================================== */

function salvarCodigoAutomatico(){

    salvarCodigo();

    salvarAutomaticamente();

}


/* =====================================================
   ADICIONAR LINGUAGEM
===================================================== */

function addLang(lang){

    /*
     * Se já existe,
     * simplesmente abre.
     */

    if(
        lang in arquivos
    ){

        abrirAba(
            lang
        );

        toggleMenu();

        return;

    }


    /*
     * Criar arquivo
     */

    arquivos[
        lang
    ] = "";


    /*
     * Criar aba
     */

    criarAba(
        lang
    );


    /*
     * Abrir
     */

    abrirAba(
        lang
    );


    /*
     * Salvar
     */

    salvarProjeto();


    toggleMenu();

}


/* =====================================================
   CRIAR ABA
===================================================== */

function criarAba(lang){

    const tabs =
        document.getElementById(
            "tabs"
        );


    /*
     * Não duplicar
     */

    if(
        document.getElementById(
            "tab-" + lang
        )
    ){

        return;

    }


    const novaAba =
        document.createElement(
            "div"
        );


    novaAba.className =
        "tab";


    novaAba.innerText =
        "main." + lang;


    novaAba.id =
        "tab-" + lang;


    novaAba.onclick =
        function(){

            abrirAba(
                lang
            );

        };


    tabs.appendChild(
        novaAba
    );

}


/* =====================================================
   ABRIR ABA
===================================================== */

function abrirAba(lang){

    /*
     * Guardar aba anterior
     */

    salvarCodigo();


    abaAtual =
        lang;


    document
        .getElementById(
            "editor"
        )
        .value =
        arquivos[
            lang
        ] || "";


    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            function(t){

                t.classList.remove(
                    "active"
                );

            }
        );


    const tab =
        document.getElementById(
            "tab-" + lang
        );


    if(tab){

        tab.classList.add(
            "active"
        );

    }


    salvarAutomaticamente();

}


/* =====================================================
   LIMPAR TEXTO ESTRANHO DA RESPOSTA
===================================================== */

function limparTextoIA(texto){

    let resultado =
        String(
            texto || ""
        );


    /*
     * Alguns backends podem enviar
     * \n literalmente.
     */

    resultado =
        resultado.replace(
            /\\r\\n/g,
            "\n"
        );


    resultado =
        resultado.replace(
            /\\n/g,
            "\n"
        );


    resultado =
        resultado.replace(
            /\\r/g,
            "\n"
        );


    return resultado;

}


/* =====================================================
   RESTAURAR HISTÓRICO
===================================================== */

function restaurarHistorico(){

    const msgs =
        document.getElementById(
            "msgs"
        );


    msgs.innerHTML = "";


    if(
        !historico ||
        historico.length === 0
    ){

        criarMensagemInicial();

        return;

    }


    historico.forEach(
        function(item){

            if(
                !item ||
                !item.role
            ){

                return;

            }


            /*
             * USUÁRIO
             */

            if(
                item.role === "user"
            ){

                addMsg(
                    escapar(
                        limparTextoIA(
                            item.content
                        )
                    ),
                    "user",
                    false
                );


                return;

            }


            /*
             * ELI
             */

            if(
                item.role === "assistant"
            ){

                adicionarMensagemEli(

                    limparTextoIA(
                        item.content
                    ),

                    item.codigo || "",

                    item.tipo || ""

                );

            }

        }
    );


    msgs.scrollTop =
        msgs.scrollHeight;

}


/* =====================================================
   ADICIONAR MENSAGEM DA ELI
===================================================== */

function adicionarMensagemEli(
    resposta,
    codigo,
    tipo
){

    const respostaLimpa =
        limparTextoIA(
            resposta
        );


    const codigoLimpo =
        limparTextoIA(
            codigo
        );


    const tipoNormalizado =
        normalizarTipo(
            tipo
        );


    let codigoId = null;


    /*
     * Cada código recebe seu próprio ID.
     */

    if(codigoLimpo){

        codigoId =
            "codigo_" +
            Date.now() +
            "_" +
            Math.floor(
                Math.random() * 1000000
            );


        codigosGerados[
            codigoId
        ] = {

            codigo:
                codigoLimpo,

            tipo:
                tipoNormalizado

        };

    }


    let html =
        `<div class="msg eli">`;


    /*
     * RESPOSTA
     */

    html +=
        escapar(
            respostaLimpa
        )
        .replace(
            /\n/g,
            "<br>"
        );


    /*
     * CÓDIGO
     */

    if(codigoLimpo){

        html += `

            <div class="codebox">

                <pre>${escapar(
                    codigoLimpo
                )}</pre>

            </div>

        `;


        /*
         * Se a linguagem não existe
         */

        if(
            !(tipoNormalizado in arquivos)
        ){

            html += `

                <div class="aviso">

                    ⚠️ A linguagem
                    <strong>
                        ${escapar(
                            tipoNormalizado.toUpperCase()
                        )}
                    </strong>
                    ainda não existe.

                    <br>

                    Clica em
                    <strong>
                        📤 Enviar para o Editor
                    </strong>
                    para criar automaticamente.

                </div>

            `;

        }


        /*
         * BOTÃO DO CÓDIGO
         */

        html += `

            <br>

            <button
                class="editor-send"
                onclick="enviarCodigoGerado(
                    '${codigoId}'
                )"
            >

                📤 Enviar para o Editor

            </button>

        `;

    }


    html +=
        `</div>`;


    document
        .getElementById(
            "msgs"
        )
        .insertAdjacentHTML(
            "beforeend",
            html
        );

}


/* =====================================================
   ENVIAR CÓDIGO GERADO PARA O EDITOR
===================================================== */

function enviarCodigoGerado(
    codigoId
){

    /*
     * Pegar EXATAMENTE o código
     * daquele botão.
     */

    const dados =
        codigosGerados[
            codigoId
        ];


    if(!dados){

        addMsg(
            "❌ Não encontrei este código.",
            "eli"
        );

        return;

    }


    const codigo =
        dados.codigo;


    const tipo =
        normalizarTipo(
            dados.tipo
        );


    if(!codigo){

        addMsg(
            "❌ O código está vazio.",
            "eli"
        );

        return;

    }


    /*
     * =================================================
     * IMPORTANTE:
     *
     * Se o arquivo já existe,
     * SUBSTITUI o código antigo.
     *
     * Se não existe,
     * CRIA o arquivo.
     * =================================================
     */

    arquivos[
        tipo
    ] =
        codigo;


    /*
     * Guardar último código
     */

    ultimoCod =
        codigo;


    ultimoTipo =
        tipo;


    /*
     * =================================================
     * SE A LINGUAGEM NÃO EXISTIR:
     * CRIAR ABA
     * =================================================
     */

    if(
        !document.getElementById(
            "tab-" + tipo
        )
    ){

        criarAba(
            tipo
        );

    }


    /*
     * =================================================
     * ABRIR AUTOMATICAMENTE A LINGUAGEM
     * =================================================
     */

    abrirAba(
        tipo
    );


    /*
     * =================================================
     * SALVAR
     * =================================================
     */

    salvarProjeto();


    /*
     * =================================================
     * MENSAGEM DE CONFIRMAÇÃO
     * =================================================
     */

    addMsg(

        "✅ Código atualizado em " +
        "main." +
        tipo +
        ".",

        "eli"

    );


    /*
     * Pequeno aviso no console
     */

    log(
        "🟢 main." +
        tipo +
        " atualizado com o novo código."
    );

}


/* =====================================================
   COMPATIBILIDADE
===================================================== */

function enviarEditor(){

    /*
     * Mantemos esta função para
     * compatibilidade com código antigo.
     */

    if(!ultimoCod){

        addMsg(
            "❌ Não encontrei código para enviar.",
            "eli"
        );

        return;

    }


    enviarCodigoDireto(
        ultimoCod,
        ultimoTipo
    );

}


/* =====================================================
   ENVIO DIRETO
===================================================== */

function enviarCodigoDireto(
    codigo,
    tipo
){

    codigo =
        limparTextoIA(
            codigo
        );


    tipo =
        normalizarTipo(
            tipo
        );


    if(!codigo){

        return;

    }


    /*
     * SUBSTITUI o arquivo existente
     */

    arquivos[
        tipo
    ] =
        codigo;


    ultimoCod =
        codigo;


    ultimoTipo =
        tipo;


    /*
     * Criar aba se necessário
     */

    if(
        !document.getElementById(
            "tab-" + tipo
        )
    ){

        criarAba(
            tipo
        );

    }


    /*
     * Abrir linguagem
     */

    abrirAba(
        tipo
    );


    /*
     * Salvar
     */

    salvarProjeto();

}


/* =====================================================
   NORMALIZAR LINGUAGEM
===================================================== */

function normalizarTipo(tipo){

    tipo =
        String(
            tipo || "js"
        )
        .toLowerCase()
        .trim();


    const mapa = {

        javascript:"js",

        js:"js",

        html:"html",

        htm:"html",

        css:"css",

        python:"py",

        py:"py",

        typescript:"ts",

        ts:"ts",

        json:"json",

        java:"java",

        php:"php",

        sql:"sql",

        c:"c",

        cpp:"cpp",

        "c++":"cpp"

    };


    return mapa[
        tipo
    ] || "js";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(texto){

    return String(
        texto || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ADICIONAR MENSAGEM
===================================================== */

function addMsg(
    t,
    tipo,
    rolar = true
){

    const id =
        "m" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 10000
        );


    document
        .getElementById(
            "msgs"
        )
        .insertAdjacentHTML(

            "beforeend",

            `
            <div
                class="msg ${tipo}"
                id="${id}"
            >
                ${t}
            </div>
            `

        );


    if(rolar){

        const msgs =
            document.getElementById(
                "msgs"
            );


        msgs.scrollTop =
            msgs.scrollHeight;

    }


    return id;

}


/* =====================================================
   ENVIAR PERGUNTA
===================================================== */

async function enviar(){

    if(enviando){

        return;

    }


    const p =
        document.getElementById(
            "perg"
        );


    if(
        !p ||
        !p.value.trim()
    ){

        return;

    }


    enviando = true;


    const pergunta =
        p.value.trim();


    /*
     * Mostrar pergunta
     */

    addMsg(
        escapar(
            pergunta
        ),
        "user"
    );


    /*
     * Guardar pergunta
     */

    historico.push({

        role:
            "user",

        content:
            pergunta

    });


    salvarProjeto();


    p.value = "";


    /*
     * Loading
     */

    const loadingId =
        addMsg(
            "Eli pensando...",
            "eli"
        );


    try{

        /*
         * Mandar somente role + content
         * para o backend.
         */

        const historicoRecente =
            historico
                .slice(-12)
                .map(
                    function(item){

                        return {

                            role:
                                item.role,

                            content:
                                item.content

                        };

                    }
                );


        const res =
            await fetch(
                "/teste-firestore",
                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            pergunta:
                                pergunta,

                            historico:
                                historicoRecente

                        })

                }
            );


        const textoResposta =
            await res.text();


        let data = null;


        try{

            data =
                JSON.parse(
                    textoResposta
                );

        }catch(e){

            console.error(
                "Resposta não JSON:",
                textoResposta
            );

        }


        /*
         * Remover loading
         */

        const loading =
            document.getElementById(
                loadingId
            );


        if(loading){

            loading.remove();

        }


        /*
         * ERRO DO SERVIDOR
         */

        if(!res.ok){

            const mensagem =
                data &&
                data.resposta

                    ? limparTextoIA(
                        data.resposta
                    )

                    : "Erro no servidor " +
                      res.status;


            addMsg(
                "❌ " +
                escapar(
                    mensagem
                ),
                "eli"
            );


            historico.push({

                role:
                    "assistant",

                content:
                    "❌ " +
                    mensagem

            });


            salvarProjeto();


            return;

        }


        /*
         * RESPOSTA INVÁLIDA
         */

        if(!data){

            const erro =
                "❌ O servidor enviou uma resposta inválida.";


            addMsg(
                erro,
                "eli"
            );


            historico.push({

                role:
                    "assistant",

                content:
                    erro

            });


            salvarProjeto();


            return;

        }


        /*
         * =================================================
         * PEGAR RESPOSTA
         * =================================================
         */

        const resposta =
            limparTextoIA(
                data.resposta ||
                "Sem resposta."
            );


        /*
         * =================================================
         * PEGAR CÓDIGO
         * =================================================
         */

        const codigo =
            limparTextoIA(
                data.codigo ||
                ""
            );


        /*
         * =================================================
         * DETECTAR LINGUAGEM
         * =================================================
         */

        const tipo =
            normalizarTipo(
                data.tipo
            );


        /*
         * =================================================
         * GUARDAR HISTÓRICO COMPLETO
         *
         * Aqui também guardamos o código.
         * =================================================
         */

        historico.push({

            role:
                "assistant",

            content:
                resposta,

            codigo:
                codigo,

            tipo:
                tipo

        });


        /*
         * Guardar último código
         */

        if(codigo){

            ultimoCod =
                codigo;

            ultimoTipo =
                tipo;

        }


        /*
         * Mostrar resposta
         */

        adicionarMensagemEli(

            resposta,

            codigo,

            tipo

        );


        /*
         * Salvar tudo
         */

        salvarProjeto();


        const msgs =
            document.getElementById(
                "msgs"
            );


        msgs.scrollTop =
            msgs.scrollHeight;


    }catch(e){

        const loading =
            document.getElementById(
                loadingId
            );


        if(loading){

            loading.remove();

        }


        const erro =
            "❌ " +
            (
                e.message ||
                "Erro de conexão com o servidor."
            );


        addMsg(
            escapar(
                erro
            ),
            "eli"
        );


        historico.push({

            role:
                "assistant",

            content:
                erro

        });


        salvarProjeto();


        console.error(
            "Erro ao comunicar com o servidor:",
            e
        );


    }finally{

        enviando =
            false;

    }

}

/* =====================================================
   RUN
===================================================== */

function run(){

    salvarCodigo();

    salvarProjeto();


    if(!abaAtual){

        log(
            "> Adiciona uma linguagem primeiro wy"
        );

        return;

    }


    const c =
        document
            .getElementById(
                "editor"
            )
            .value;


    /*
     * JAVASCRIPT
     */

    if(
        abaAtual === "js"
    ){

        try{

            const r =
                new Function(
                    c
                )();


            log(
                "> Resultado: " +
                r
            );


        }catch(e){

            log(
                "> Erro: " +
                e.message
            );

        }


        return;

    }


    /*
     * HTML
     */

    if(
        abaAtual === "html"
    ){

        if(
            !c.trim()
        ){

            log(
                "🔴 SITE NÃO ATIVO"
            );


            log(
                "❌ O arquivo main.html está vazio."
            );


            return;

        }


        try{

            const blob =
                new Blob(

                    [c],

                    {
                        type:
                            "text/html"
                    }

                );


            const url =
                URL.createObjectURL(
                    blob
                );


            log(
                "🟢 SITE ATIVO"
            );


            const logBox =
                document.getElementById(
                    "log"
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.target =
                "_blank";


            link.rel =
                "noopener noreferrer";


            link.innerText =
                "🔗 Abrir site";


            link.className =
                "site-link";


            logBox.appendChild(
                document.createElement(
                    "br"
                )
            );


            logBox.appendChild(
                link
            );


            logBox.scrollTop =
                logBox.scrollHeight;


        }catch(e){

            log(
                "🔴 SITE NÃO ATIVO"
            );


            log(
                "❌ Erro: " +
                e.message
            );

        }


        return;

    }


    /*
     * CSS
     */

    if(
        abaAtual === "css"
    ){

        log(
            "> CSS não roda sozinho, usa com HTML"
        );


        return;

    }


    /*
     * PYTHON
     */

    if(
        abaAtual === "py"
    ){

        log(
            "> Python só roda no servidor"
        );


        return;

    }


    log(
        "> Linguagem " +
        abaAtual +
        " não possui RUN configurado."
    );

}
