<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;overflow:hidden}
.chat{height:45vh;background:#0a3d0a;display:flex;flex-direction:column}
.header{padding:10px;background:#062806;color:#0f0;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:10px}
.msg{padding:10px;border-radius:8px;margin:5px 0;max-width:85%;white-space:pre-wrap}
.user{background:#1a1a1a;color:#0f0;margin-left:auto}
.eli{background:#0f5f0f;color:#fff}
.input{display:flex;padding:10px;background:#062806;gap:5px;border-top:2px solid #0f0}
.input input{flex:1;padding:12px;background:#111;border:1px solid #0f0;color:#fff;border-radius:8px}
.input button{padding:12px;background:#0f0;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn2{background:#fa0!important}

.editor{height:27.5vh;background:#0a0f2e;border-top:2px solid #60a5fa}
.tabs{background:#062806;padding:5px;display:flex;gap:5px;border-bottom:1px solid #0f0;overflow-x:auto;min-height:35px}
.tab{padding:6px 12px;background:#111;border:1px solid #0f0;border-radius:5px;cursor:pointer;color:#0f0;font-size:12px;white-space:nowrap}
.tab.active{background:#0f0;color:#000;font-weight:bold}

.editor textarea{width:100%;height:calc(100% - 45px);box-sizing:border-box;background:#0a0f2e;color:#93c5fd;border:none;padding:10px;resize:none;outline:none;font-size:13px;font-family:Consolas}

.console{height:20vh;background:#3d3d00}
.chead{padding:8px;background:#2e2e00;color:yellow;display:flex;justify-content:space-between}
.cbody{padding:10px;color:#ff9;font-size:12px;height:calc(100% - 40px);overflow-y:auto}

#menuBox{display:none;position:fixed;bottom:70px;left:10px;background:#111;border:2px solid #0f0;padding:10px;border-radius:10px;width:220px;z-index:999}
#menuBox div{padding:8px;cursor:pointer;border-radius:5px;border-bottom:1px solid #222}
#menuBox div:hover{background:#0f0;color:#000}
#menuBox.lang{color:#60a5fa}
.aviso{color:#fa0;font-weight:bold;margin-top:8px;font-size:13px}

.codebox{
  margin-top:8px;
  background:#050505;
  border:1px solid #333;
  border-radius:6px;
  padding:8px;
  overflow:auto;
  max-height:180px;
}

.codebox pre{
  margin:0;
  color:#93c5fd;
  font-size:12px;
  white-space:pre-wrap;
}

/* LINK DO SITE */
.site-link{
  display:inline-block;
  margin-top:8px;
  padding:9px 14px;
  background:#0f0;
  color:#000;
  border-radius:7px;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

.site-link:hover{
  background:#7cff7c;
}

.status-active{
  color:#0f0;
  font-weight:bold;
}

.status-error{
  color:#ff5555;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="chat">

  <div class="header">
    <span>ELI AI</span>
    <button class="btn2" onclick="toggleMenu()">⋮</button>
  </div>

  <div class="msgs" id="msgs">
    <div class="msg eli">
      Fala wy! Sou a Eli. Me pede código 🚀
    </div>
  </div>

  <div class="input">

    <input
      id="perg"
      placeholder="Digite..."
      onkeypress="if(event.key==='Enter')enviar()"
    >

    <button
      class="btn2"
      onclick="enviarFoto()"
    >
      📷
    </button>

    <button onclick="enviar()">
      Enviar
    </button>

  </div>

</div>


<div class="editor" id="editorBox">

  <div class="tabs" id="tabs"></div>

  <textarea id="editor">Adiciona uma linguagem no menu ⋮</textarea>

</div>


<div class="console">

  <div class="chead">

    <span>CONSOLE</span>

    <div>

      <button
        class="btn2"
        onclick="enviarErro()"
      >
        🐛
      </button>

      <button onclick="run()">
        RUN
      </button>

    </div>

  </div>

  <div class="cbody" id="log">

    &gt; Conectado...<br>
    &gt; Aguardando...

  </div>

</div>


<div id="menuBox">

  <div
    onclick="addLang('html')"
    class="lang"
  >
    🌐 Adicionar HTML
  </div>

  <div
    onclick="addLang('css')"
    class="lang"
  >
    🎨 Adicionar CSS
  </div>

  <div
    onclick="addLang('js')"
    class="lang"
  >
    📜 Adicionar JS
  </div>

  <div
    onclick="addLang('py')"
    class="lang"
  >
    🐍 Adicionar Python
  </div>

  <hr>

  <div onclick="alert('Settings em breve wy')">
    ⚙️ Settings
  </div>

  <div onclick="alert('Projeto em breve wy')">
    📁 Projeto
  </div>

  <hr>

  <div onclick="limpar()">
    🧹 Limpar Console
  </div>

</div>


<script>

let arquivos = {};

let abaAtual = null;

let ultimoCod = "";

let ultimoTipo = "js";

let historico = [];

let enviando = false;


/* =========================
   SALVAR CÓDIGO
========================= */

function salvarCodigo(){

  if(abaAtual){

    arquivos[abaAtual] =
      document.getElementById("editor").value;

  }

}


/* =========================
   ADICIONAR LINGUAGEM
========================= */

function addLang(lang){

  if(lang in arquivos){

    abrirAba(lang);

    toggleMenu();

    return;

  }

  arquivos[lang] = "";

  criarAba(lang);

  abrirAba(lang);

  toggleMenu();

}


/* =========================
   CRIAR ABA
========================= */

function criarAba(lang){

  let tabs =
    document.getElementById("tabs");

  let novaAba =
    document.createElement("div");

  novaAba.className = "tab";

  novaAba.innerText =
    "main." + lang;

  novaAba.onclick =
    () => abrirAba(lang);

  novaAba.id =
    "tab-" + lang;

  tabs.appendChild(novaAba);

}


/* =========================
   ABRIR ABA
========================= */

function abrirAba(lang){

  salvarCodigo();

  abaAtual = lang;

  document.getElementById("editor").value =
    arquivos[lang] || "";

  document.querySelectorAll(".tab")
    .forEach(t =>
      t.classList.remove("active")
    );

  let tab =
    document.getElementById("tab-" + lang);

  if(tab){

    tab.classList.add("active");

  }

}


/* =========================
   ENVIAR PERGUNTA
========================= */

async function enviar(){

  if(enviando) return;

  let p =
    document.getElementById("perg");

  if(!p || !p.value.trim()) return;

  enviando = true;

  let pergunta =
    p.value.trim();

  addMsg(
    escapar(pergunta),
    "user"
  );

  historico.push({

    role:"user",

    content:pergunta

  });

  p.value = "";

  let loadingId =
    addMsg(
      "Eli pensando...",
      "eli"
    );


  try{

    let historicoRecente =
      historico.slice(-12);


    let res =
      await fetch(
        "/teste-firestore",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Accept":
              "application/json"
          },

          body:JSON.stringify({

            pergunta:
              pergunta,

            historico:
              historicoRecente

          })

        }
      );


    let textoResposta =
      await res.text();


    let data = null;

    try{

      data =
        JSON.parse(textoResposta);

    }catch(e){

      console.error(
        "Resposta não JSON:",
        textoResposta
      );

    }


    let loading =
      document.getElementById(loadingId);

    if(loading){

      loading.remove();

    }


    /* =========================
       ERRO DO SERVIDOR
    ========================= */

    if(!res.ok){

      let mensagem =
        data && data.resposta
          ? data.resposta
          : "Erro no servidor " + res.status;

      addMsg(
        "❌ " + mensagem,
        "eli"
      );

      console.error(
        "Erro:",
        res.status,
        textoResposta
      );

      return;

    }


    if(!data){

      addMsg(
        "❌ O servidor enviou uma resposta inválida.",
        "eli"
      );

      return;

    }


    /* =========================
       RESPOSTA
    ========================= */

    if(data.resposta){

      historico.push({

        role:"assistant",

        content:data.resposta

      });

    }


    let html =
      `<div class="msg eli">`;

    html +=
      escapar(data.resposta || "Sem resposta.")
      .replace(/\n/g,"<br>");


    /* =========================
       CÓDIGO
    ========================= */

    if(data.codigo){

      ultimoCod =
        data.codigo;

      ultimoTipo =
        normalizarTipo(
          data.tipo
        );


      let nomeTipo =
        ultimoTipo.toUpperCase();


      html +=
        `<div class="codebox">
          <pre>${escapar(ultimoCod)}</pre>
        </div>`;


      /* =========================
         ABA NÃO EXISTE
      ========================= */

      if(!(ultimoTipo in arquivos)){

        html +=
          `<div class="aviso">
            ⚠️ Wy, tá faltando a aba ${nomeTipo}<br>
            Vai no menu ⋮ e clica em
            "Adicionar ${nomeTipo}"
          </div>`;

      }


      /* =========================
         BOTÃO EDITOR
      ========================= */

      html +=
        `<br>
        <button
          class="btn2"
          onclick="enviarEditor()">
          📤 Enviar pro Editor
        </button>`;

    }


    html +=
      `</div>`;


    document
      .getElementById("msgs")
      .insertAdjacentHTML(
        "beforeend",
        html
      );


    document
      .getElementById("msgs")
      .scrollTop =
        document.getElementById("msgs").scrollHeight;


  }catch(e){

    let loading =
      document.getElementById(loadingId);

    if(loading){

      loading.remove();

    }


    addMsg(
      "❌ " + e.message,
      "eli"
    );


    console.error(
      "Erro ao comunicar com o servidor:",
      e
    );


  }finally{

    enviando = false;

  }

}


/* =========================
   NORMALIZAR LINGUAGEM
========================= */

function normalizarTipo(tipo){

  tipo =
    String(tipo || "js")
    .toLowerCase()
    .trim();

  const mapa = {

    javascript:"js",

    js:"js",

    html:"html",

    htm:"html",

    css:"css",

    python:"py",

    py:"py",

    typescript:"ts",

    ts:"ts",

    json:"json",

    java:"java",

    php:"php",

    sql:"sql",

    c:"c",

    cpp:"cpp",

    "c++":"cpp"

  };

  return mapa[tipo] || "js";

}


/* =========================
   ESCAPAR HTML
========================= */

function escapar(texto){

  return String(texto)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   ADICIONAR MENSAGEM
========================= */

function addMsg(t,tipo){

  let id =
    "m" + Date.now();

  document
    .getElementById("msgs")
    .insertAdjacentHTML(
      "beforeend",
      `<div class="msg ${tipo}" id="${id}">
        ${t}
      </div>`
    );

  document
    .getElementById("msgs")
    .scrollTop =
      document.getElementById("msgs").scrollHeight;

  return id;

}


/* =========================
   FOTO
========================= */

function enviarFoto(){

  addMsg(
    "📷 Foto",
    "user"
  );

  addMsg(
    "Manda a foto wy",
    "eli"
  );

}


/* =========================
   ENVIAR CÓDIGO AO EDITOR
========================= */

function enviarEditor(){

  salvarCodigo();


  if(!ultimoCod){

    addMsg(
      "❌ Não encontrei código para enviar.",
      "eli"
    );

    return;

  }


  /* =========================
     CRIAR ABA AUTOMATICAMENTE
  ========================= */

  if(!(ultimoTipo in arquivos)){

    arquivos[ultimoTipo] = "";

    criarAba(ultimoTipo);

  }


  /* =========================
     COLOCAR CÓDIGO
  ========================= */

  arquivos[ultimoTipo] =
    ultimoCod;


  abrirAba(ultimoTipo);


  addMsg(
    "✅ Código enviado para main." +
    ultimoTipo,
    "eli"
  );

}


/* =========================
   MENU
========================= */

function toggleMenu(){

  let m =
    document.getElementById("menuBox");

  m.style.display =
    m.style.display === "block"
      ? "none"
      : "block";

}


/* =========================
   LIMPAR CONSOLE
========================= */

function limpar(){

  document
    .getElementById("log")
    .innerHTML =
      "> Limpo";

}


/* =========================
   RUN
========================= */

function run(){

  salvarCodigo();


  if(!abaAtual){

    log(
      "> Adiciona uma linguagem primeiro wy"
    );

    return;

  }


  let c =
    document
      .getElementById("editor")
      .value;


  /* =========================
     JAVASCRIPT
  ========================= */

  if(abaAtual === "js"){

    try{

      let r =
        new Function(c)();

      log(
        "> Resultado: " +
        r
      );

    }catch(e){

      log(
        "> Erro: " +
        e.message
      );

    }

  }


  /* =========================
     HTML
  ========================= */

  else if(abaAtual === "html"){

    if(!c.trim()){

      log(
        "🔴 SITE NÃO ATIVO"
      );

      log(
        "❌ O arquivo main.html está vazio."
      );

      return;

    }


    try{

      /*
       * Criar uma URL temporária
       * para o HTML.
       */

      const blob =
        new Blob(
          [c],
          {
            type:"text/html"
          }
        );


      const url =
        URL.createObjectURL(blob);


      /*
       * Site ativo
       */

      log(
        "🟢 SITE ATIVO"
      );


      /*
       * Criar link
       */

      const logBox =
        document.getElementById("log");


      const link =
        document.createElement("a");


      link.href =
        url;

      link.target =
        "_blank";

      link.rel =
        "noopener noreferrer";


      link.innerText =
        "🔗 Abrir site";


      link.className =
        "site-link";


      logBox.appendChild(
        document.createElement("br")
      );

      logBox.appendChild(
        link
      );


      logBox.scrollTop =
        logBox.scrollHeight;


    }catch(e){

      log(
        "🔴 SITE NÃO ATIVO"
      );

      log(
        "❌ Erro: " +
        e.message
      );

    }

  }


  /* =========================
     CSS
  ========================= */

  else if(abaAtual === "css"){

    log(
      "> CSS não roda sozinho, usa com HTML"
    );

  }


  /* =========================
     PYTHON
  ========================= */

  else if(abaAtual === "py"){

    log(
      "> Python só roda no servidor"
    );

  }


  else{

    log(
      "> Linguagem " +
      abaAtual +
      " não possui RUN configurado."
    );

  }

}


/* =========================
   CONSOLE
========================= */

function log(t){

  document
    .getElementById("log")
    .innerHTML +=
      "<br>" + escapar(t);

}


/* =========================
   ENVIAR ERRO
========================= */

function enviarErro(){

  let e =
    document
      .getElementById("log")
      .innerText;

  document
    .getElementById("perg")
    .value =
      "Eli me ajuda: " + e;

  enviar();

}

</script>

</body>
</html>
